<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saisonplan</title>
<meta name="description" content="Trainingsplan für Triathlon, Laufen und Rennrad mit KI-Coach">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D6C8A">
<style>
/* Layout: Startnummern-/Zeitmess-Ästhetik. Wochen-Kalender zum Wischen, Einheiten als Karten, Details im Bottom-Sheet. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface2:#E2E8EB; --ink:#112029; --muted:#566871; --line:#D0D9DE;
  --accent:#0D6C8A; --ok:#1E9560;
  --swim:#0A8DB8; --bike:#D07A00; --run:#D8432C; --gym:#5F50CF; --heat:#B83271; --race:#112029; --rest:#7D8B93;
  --ph-R:#8EA2AD; --ph-B:#3B78A3; --ph-U:#C07408; --ph-S:#CC3F2A; --ph-T:#24865A;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(17,32,41,.06),0 4px 14px rgba(17,32,41,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1216; --surface:#131D23; --surface2:#1A262D; --ink:#E3EBEE; --muted:#93A5AF; --line:#24333B;
  --accent:#4DB2D2; --ok:#4BC189;
  --swim:#3CB3D5; --bike:#E7A23A; --run:#F0694F; --gym:#9C93EA; --heat:#EE77AE; --race:#E3EBEE; --rest:#8E9DA5;
  --ph-R:#6E838E; --ph-B:#4F95C4; --ph-U:#E7A23A; --ph-S:#F0694F; --ph-T:#4BC189;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1216; --surface:#131D23; --surface2:#1A262D; --ink:#E3EBEE; --muted:#93A5AF; --line:#24333B;
  --accent:#4DB2D2; --ok:#4BC189;
  --swim:#3CB3D5; --bike:#E7A23A; --run:#F0694F; --gym:#9C93EA; --heat:#EE77AE; --race:#E3EBEE; --rest:#8E9DA5;
  --ph-R:#6E838E; --ph-B:#4F95C4; --ph-U:#E7A23A; --ph-S:#F0694F; --ph-T:#4BC189;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.brand .sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.weeknav{display:flex;align-items:center;gap:8px;margin-top:10px}
.weeknav .arrow{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;cursor:pointer}
.weeknav .arrow:disabled{opacity:.35}
.wk-title{flex:1;min-width:0;text-align:center}
.wk-title .kw{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.05}
.wk-title .dates{font-size:13px;color:var(--muted)}
.todaybtn{flex:none;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Zeitleiste */
.timeline{margin-top:10px;overflow-x:auto;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.tl-row{display:flex;gap:3px;padding-bottom:2px}
.tl-w{flex:none;width:14px;height:22px;border-radius:3px;background:var(--c);opacity:.85;border:0;padding:0;cursor:pointer;position:relative}
.tl-w.dl{height:14px;margin-top:8px}
.tl-w.past{opacity:.35}
.tl-w.race::before{content:"";position:absolute;left:3px;top:-7px;width:8px;height:5px;border-radius:2px;background:var(--ink)}
.tl-w.main::before{content:"★";left:1px;top:-14px;width:auto;height:auto;background:none;color:var(--ink);font-size:11px;line-height:1}
.tl-row{padding-top:14px}
.tl-w.cur{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.tl-w.now::after{content:"";position:absolute;left:5px;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--c);display:inline-block}

/* Wochenkopf */
.weekhead{margin-top:14px;display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--surface2);color:var(--ink)}
.chip.phase{background:var(--c);color:#fff}
.chip.dl{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.chip.race{background:var(--ink);color:var(--bg)}
.focus{font-size:14px;color:var(--ink);margin:0;max-width:65ch}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.tot{background:var(--surface);border-radius:10px;padding:8px 8px 7px;border-top:3px solid var(--c);min-width:0}
.tot b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tot em{display:block;font-style:normal;font-family:var(--f-display);font-size:14px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tot small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sumline{font-size:13px;color:var(--muted)}
.daybtn{margin-top:6px;width:30px;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.sicknote{font-size:12px;font-weight:700;color:var(--run);text-transform:uppercase;letter-spacing:.05em}
.s.restc{background:transparent;outline:1px dashed var(--line)}
.dayopts{display:grid;gap:8px;margin-top:14px}
.dayopt{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}
.dayopt b{font-family:var(--f-display);font-size:18px}
.dayopt span{font-size:13px;color:var(--muted)}
.dayopt.on{outline:2px solid var(--accent);background:var(--surface)}
.goal .big{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.goal .gsub{font-size:13px;color:var(--muted);margin-bottom:8px}
.goal input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.gtag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;color:#fff}
.gtag.ok{background:var(--ok)}.gtag.mid{background:var(--bike)}.gtag.hard{background:var(--run)}
.racel{display:grid;gap:6px;margin-bottom:12px}
.racei{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface2)}
.racei b{font-weight:700}.racei small{grid-column:1;color:var(--muted);font-size:12px}
.racei button{grid-row:1/3;grid-column:2}
.field select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 10px;font-size:16px;font-family:var(--f-body);width:100%}
.gbadge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.xact{font-size:13px;color:var(--muted);padding:2px 2px}.xsep{display:flex;align-items:center;gap:8px;margin:6px 0 0;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.xsep::before,.xsep::after{content:'';height:1px;background:var(--line)}.xsep::before{flex:0 0 10px}.xsep::after{flex:1}.s.xs{opacity:.8;background:color-mix(in srgb,var(--c) 6%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}.s.xs .bar{opacity:.55}.xact em{font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.report{margin-top:14px}.report h3{font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.aibox{margin-top:14px;display:grid;gap:10px}.aiout{white-space:pre-wrap;font-size:14px;line-height:1.5}
.drop{display:grid;gap:4px;border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:var(--surface2)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.drop b{font-family:var(--f-display);font-size:17px}.drop span{font-size:13px;color:var(--muted)}
.drop:focus-within{outline:2px solid var(--accent)}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:70;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:grid;max-height:320px;overflow-y:auto}
.sugg button{display:grid;gap:1px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 12px;cursor:pointer}
.sugg button:hover,.sugg button:focus{background:var(--surface2)}.sugg b{font-size:14px}.sugg span{font-size:12px;color:var(--muted)}.sugg small{padding:8px 12px;font-size:11px;color:var(--muted)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}@media (max-width:420px){.row3{grid-template-columns:1fr}}
.dayset{border:0;padding:0;margin:0;display:grid;gap:6px}.dayset legend{font-size:13px;font-weight:600;margin-bottom:4px}
.dayboxes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daybox{position:relative}.daybox input{position:absolute;opacity:0;width:1px;height:1px}
.daybox span{display:block;text-align:center;padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-family:var(--f-display);font-weight:700;font-size:15px;cursor:pointer}
.daybox input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}.daybox input:focus-visible+span{outline:2px solid var(--accent)}
.wheel{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.wheel select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 10px;font-size:18px;font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;min-width:0;flex:0 1 84px}
.wsep{font-family:var(--f-display);font-weight:700;font-size:20px}.wunit{font-size:13px;color:var(--muted)}
.wprog{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.wprog span{height:4px;border-radius:2px;background:var(--line)}.wprog .done{background:var(--accent)}.wprog .cur{background:var(--ink)}
.wstep{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.tiles{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:130px 1fr;align-items:stretch;text-align:left;border:0;padding:0;border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;min-height:110px}
.tile .art{background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));display:grid;place-items:center;padding:10px}.tile .art svg{width:100%;height:auto;max-width:120px}
.tile .tt{padding:14px 16px;display:grid;align-content:center;gap:4px}.tile .tt b{font-family:var(--f-display);font-size:28px;text-transform:uppercase;letter-spacing:.02em;line-height:1}.tile .tt small{color:var(--muted);font-size:13px}
.tile.on{outline:3px solid var(--c)}.tile:focus-visible{outline:3px solid var(--accent)}
.flabel{font-size:13px;font-weight:600}
.chips2{display:flex;flex-wrap:wrap;gap:6px}.chip2{position:relative}.chip2 input{position:absolute;opacity:0;width:1px;height:1px}
.chip2 span{display:grid;gap:1px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}.chip2 b{font-family:var(--f-display);font-size:16px}.chip2 small{font-size:11px;color:var(--muted)}
.chip2 input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip2 input:checked+span small{color:var(--bg);opacity:.8}.chip2 input:focus-visible+span{outline:2px solid var(--accent)}
.vrow{display:grid;gap:10px}
.vcard{display:grid;gap:8px;padding:14px;border-radius:14px;background:var(--surface);border-left:5px solid var(--c)}.vcard>b{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.unk{display:flex;gap:10px;align-items:center;font-size:14px}.unk input{width:20px;height:20px;accent-color:var(--accent)}
.sumgrid{display:grid;gap:8px}.sumgrid>div{background:var(--surface);border-radius:12px;padding:10px 12px;display:grid;gap:2px}.sumgrid small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.sumgrid b{font-size:16px}.sumgrid span{font-size:13px;color:var(--muted)}
.wnav{display:flex;justify-content:space-between;gap:10px;margin-top:6px;position:sticky;bottom:calc(-30px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 calc(30px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 14px -10px rgba(0,0,0,.18)}
.wnav .btn{flex:1}
@media (max-width:420px){.tile{grid-template-columns:104px 1fr}.tile .tt b{font-size:24px}}
.wiz{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wiz-in{max-width:560px;margin:0 auto;display:grid;gap:10px}
.wiz h1{margin:0;font-family:var(--f-display);font-size:34px;text-transform:uppercase;letter-spacing:.02em}
.wiz h2{margin:14px 0 0;font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wiz p{margin:0;color:var(--muted)}.wiz small{color:var(--muted);font-size:12px}
.wiz input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.flexbox{background:var(--surface);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.flexrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.flexrow label{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.flexrow b{font-size:20px}
#flexR{width:100%;accent-color:var(--accent);height:28px}
.flexscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.flexhint{margin:0;font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;font-size:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent)}
.progressbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

/* Tage */
#weekWrap{touch-action:pan-y}
.days{display:grid;gap:10px;margin-top:14px}
.anim-l{animation:inL .22s ease-out}.anim-r{animation:inR .22s ease-out}
@keyframes inL{from{transform:translateX(24px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(-24px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.anim-l,.anim-r{animation:none}}
.day{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 10px 8px;display:grid;grid-template-columns:52px 1fr;gap:8px}
.day.today{outline:2px solid var(--accent)}
.dlabel{display:flex;flex-direction:column;align-items:flex-start;padding-top:2px}
.dlabel b{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1;text-transform:uppercase}
.dlabel span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dlabel em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:3px}
.sess{display:grid;gap:6px;min-width:0}
.s{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface2);border:0;border-radius:10px;padding:8px 10px 8px 0;cursor:pointer;min-width:0}
.s .bar{align-self:stretch;border-radius:0 3px 3px 0;background:var(--c)}
.s .t{min-width:0}
.s .t b{display:block;font-weight:700;font-size:15px;line-height:1.2}
.s .t b .ic{color:var(--c);font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.s .t span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.s .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.s .kmv{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.s .dur{font-family:var(--f-display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.s.key .t b::after{content:"KEY";margin-left:6px;font-family:var(--f-display);font-size:11px;letter-spacing:.08em;padding:1px 5px;border-radius:4px;background:var(--ink);color:var(--bg);vertical-align:2px}
.s.opt{opacity:.75}
.s{background:var(--surface2);background:color-mix(in srgb,var(--c) 10%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent)}
.s .bar{width:4px}
.s:hover{background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.s.done{background:color-mix(in srgb,var(--ok) 15%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ok) 60%,transparent)}
.s.done .bar{background:var(--ok)}
.s.done .dur,.s.done .t b{color:color-mix(in srgb,var(--ok) 45%,var(--ink))}
.s.miss{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);opacity:.62}
.s.miss .t>span{color:var(--run);font-weight:600}
.s.cancel{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);opacity:.5}
.s.cancel .t b{text-decoration:line-through;text-decoration-color:var(--muted)}
.s.cancel .bar{background:var(--line)}
.stag{display:inline-block;margin-top:4px;margin-right:6px;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:999px}
.stag.ok{background:var(--ok);color:#fff}
.stag.alt{background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--ink)}
.day.past:not(.today){background:color-mix(in srgb,var(--surface) 85%,var(--bg))}
.day.today{outline:2.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.injnote{border-left-color:var(--run)}
.adjbox{margin:12px 0 4px;padding:10px;border-radius:12px;background:var(--surface2)}.adj{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.adjq{width:100%;font-weight:700;font-size:14px}.adjb.danger{border-color:var(--run);color:var(--run)}
.adjb{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.adjb.why{background:var(--surface);border-color:var(--run);color:var(--run)}
#injCard .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}#injCard input[type=date],#injCard select{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 10px;font:inherit}
.meter{display:flex;gap:2px}
.meter i{width:5px;height:10px;border-radius:1px;background:var(--line)}
.meter i.on{background:var(--c)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Eigener Speicherbereich: jede Datei-Kopie (anderer Dateipfad) speichert getrennt */
let NS='trv.local.';
/* ---------- Speicher ---------- */
const DEF={ftp:250,thr:300,css:110,ld:'',md1:'',md2:'',goals:{ld:660,md1:300,md2:300},extra:[],setup:false,sport:'',name:'',mainName:'',mainType:'LD',hours:15,kg:72,start:''};
function load(k,d){try{const v=localStorage.getItem(k);return v?Object.assign({},d,JSON.parse(v)):Object.assign({},d)}catch(e){return Object.assign({},d)}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}if(typeof cloudPush==='function')cloudPush(k)}
let S=load(NS+'settings',DEF);if(!S.goals)S.goals=Object.assign({},DEF.goals);if(!Array.isArray(S.extra))S.extra=[];
let STAT=load(NS+'status',{});
let DONE=load(NS+'done',{});

/* ---------- Helfer ---------- */
let START=(()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d})();
const DAY=864e5;
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MON=['Jän','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const r5=x=>Math.round(x/5)*5;
const W=(a,b)=>`${r5(S.ftp*a/100)}–${r5(S.ftp*b/100)} W`;
const mmss=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const P=(a,b)=>`${mmss(S.thr+a)}–${mmss(S.thr+b)}/km`;
const SW=(a,b)=>b===undefined?`${mmss(S.css+a)}/100 m`:`${mmss(S.css+a)}–${mmss(S.css+b)}/100 m`;
const pick=(a,i)=>a[Math.max(0,Math.min(a.length-1,i))];
const pd=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);if(!y||!m||!d)return null;return new Date(y,m-1,d)};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fd=d=>`${d.getDate()}. ${MON[d.getMonth()]}`;
const weekIdx=d=>Math.round((monday(d)-START)/(7*DAY));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/DAY+1)/7)}

const PH={R:{n:'Rückkehr',c:'--ph-R'},B:{n:'Basis',c:'--ph-B'},U:{n:'Aufbau',c:'--ph-U'},S:{n:'Spezifisch',c:'--ph-S'},T:{n:'Taper',c:'--ph-T'}};
const SP={swim:{n:'Schwimmen',c:'--swim'},bike:{n:'Rad',c:'--bike'},run:{n:'Laufen',c:'--run'},gym:{n:'Gym',c:'--gym'},race:{n:'Rennen',c:'--race'},heat:{n:'Hitze',c:'--heat'},rest:{n:'Pause',c:'--rest'}};
const SHORT=['KD','SP','OD'];
const RT={K5:'5 km',TR:'Trail / Ultra',GF:'Radmarathon / Gran Fondo',ZF:'Zeitfahren',BZ:'Bergzeitfahren',SP:'Sprint',OD:'Olympisch',MD:'Mitteldistanz',LD:'Langdistanz',KD:'Sprint / Olympisch',HM:'Halbmarathon',M:'Marathon',K10:'10 km'};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function allRaces(){const rc=[];
 if(pd(S.md1))rc.push({d:pd(S.md1),name:'IRONMAN 70.3 Jesolo',type:'MD',prio:'A',goal:'md1'});
 if(pd(S.md2))rc.push({d:pd(S.md2),name:'Challenge Walchsee',type:'MD',prio:'C',goal:'md2'});
 (S.extra||[]).forEach((r,k)=>{const d=pd(r.date);if(d&&RT[r.type])rc.push({d,name:r.name||RT[r.type],type:r.type,prio:r.prio||'B',x:k,km:r.km,hm:r.hm})});
 return rc.sort((a,b)=>a.d-b.d)}

/* ---------- Wochen aufbauen ---------- */
let WEEKS=[];
function buildWeeks(){
  if(S.start&&pd(S.start))START=monday(pd(S.start));
  const mainD=pd(S.ld);
  const list=[];
  if(mainD&&S.mainType)list.push({d:mainD,type:S.mainType,name:S.mainName||RT[S.mainType],prio:'A',goal:'ld',main:true,km:S.mainKm,hm:S.mainHm});
  allRaces().forEach(r=>list.push(r));
  const md=list.map(r=>Object.assign({},r,{i:weekIdx(r.d),dd:(r.d.getDay()+6)%7})).filter(r=>r.i>=0).sort((a,b)=>a.i-b.i||(b.main?1:-1));
  const N=Math.max(12,md.length?Math.max(...md.map(r=>r.i))+2:40);
  const ph=new Array(N).fill(null),tgt=new Array(N).fill(null),rec=new Set();
  const SPEC={LD:[10,2,2],MD:[6,1,1],OD:[4,1,0],SP:[3,1,0],KD:[4,1,0],M:[8,2,2],HM:[6,1,1],K10:[5,1,0],K5:[4,1,0],TR:[8,2,1],GF:[8,1,1],ZF:[5,1,0],BZ:[5,1,0]};
  const A=md.filter(r=>SPEC[r.type]&&(r.main||r.prio==='A'));
  A.slice().sort((a,b)=>b.i-a.i).forEach(r=>{const [sp,tp,rc]=SPEC[r.type];
    for(let k=0;k<tp;k++){const j=r.i-k;if(j>=0&&!ph[j]){ph[j]='T';tgt[j]=r.type}}
    for(let k=tp;k<tp+sp;k++){const j=r.i-k;if(j>=0&&!ph[j]){ph[j]='S';tgt[j]=r.type}}
    for(let k=1;k<=rc;k++){const j=r.i+k;if(j<N&&!ph[j]){ph[j]='B';rec.add(j)}}});
  // Lücken füllen: am Anfang Basis (bis 14 Wochen), nach Rennen Aufbau
  let first=true;for(let i=0;i<N;){if(ph[i]){if(ph[i]!=='B')first=false;i++;continue}let j=i;while(j<N&&!ph[j])j++;const len=j-i;
    for(let k=i;k<j;k++)ph[k]=first?((k-i)<Math.min(14,len-Math.min(6,Math.floor(len/3)))?'B':'U'):(len>=8&&(k-i)<3?'B':'U');first=false;i=j}
  // Ziel-Typ für Wochen ohne eigenes (nächstes A-Rennen)
  for(let i=0;i<N;i++){if(!tgt[i]){const a=A.find(r=>r.i>=i);tgt[i]=a?a.type:(A.length?A[A.length-1].type:'LD')}}
  WEEKS=[];const ndc={};let sd=0,dlc=0,pw=0;
  for(let i=0;i<N;i++){
    pw=i>0&&ph[i]===ph[i-1]?pw+1:0;
    const here=md.filter(m=>m.i===i);const mdh=here.find(m=>m.main)||here[0];

/* Wochenplaner: verteilt die Einheiten nach Ruhetagen, Langtagen und kurzen Tagen */
function planCfg(){const P=S.plan||{};const rest=new Set((P.rest||[]).map(Number));const short=new Set((P.short||[]).map(Number));
  let LR=P.lr!=null?+P.lr:6,LN=P.ln!=null?+P.ln:4;rest.delete(LR);rest.delete(LN);if(LN===LR)LN=(LR+6)%7;rest.delete(LN);
  return {rest,short,LR,LN,exp:P.exp||'mid'}}
function normalDays(c){
  const K=planCfg(),g=c.f||1,u=c.unk||{};
  const days=[[],[],[],[],[],[],[]];const free=d=>!K.rest.has(d);
  const nb=d=>[(d+6)%7,(d+1)%7];
  const hardOn=(d,sp)=>days[d].some(s=>(s.key||s.inten>=4)&&(!sp||s.sport===sp));
  const load=d=>days[d].reduce((a,s)=>a+(s.min||0),0);

    order.forEach(s=>{const want=s.sport==='race'||s.cancel?null:(s.xt?'xt':s.sport);if(!want||want==='rest'||want==='heat')return;let k=-1,best=1e9;acts.forEach((a,ix)=>{if(used.has(ix)||a.cat!==want)return;const diff=Math.abs((a.dur||0)/60-(s.min||0));if(diff<best){best=diff;k=ix}});if(k>=0){used.add(k);byId[s.id]=acts[k]}});

function weekReport(w,days,MT){const plan={swim:0,bike:0,run:0,gym:0};const keys=[],missed=[];let sick=0,off=0;const today=new Date();today.setHours(0,0,0,0);
  days.forEach((list,d)=>{const date=addD(w.start,d);list.forEach(s=>{if(s.sport==='rest'){s.status==='sick'?sick++:off++;return}if(s.sport==='race'||s.opt||s.cancel)return;if(date<=today)plan[s.sport]+=s.min;
    if(s.key&&date<today){keys.push(s);if(!(isDoneM(s)||MT.byId[s.id]))missed.push(`${WD[d]}: ${SP[s.sport].n} · ${s.kind}`)}})});
  const hasG=Object.values(MT.ist).some(v=>v>0);const ist={};['swim','bike','run','gym'].forEach(k=>{let v=MT.ist[k];if(!hasG){v=0;days.forEach(l=>l.forEach(s=>{if(s.sport===k&&isDoneM(s))v+=s.min}))}ist[k]=v});
  const good=[],bad=[],next=[];
  ['swim','bike','run'].forEach(k=>{if(plan[k]<30)return;const q=ist[k]/plan[k];if(q>=0.9)good.push(`${SP[k].n}: ${Math.round(q*100)} % vom Plan`);else if(q<0.7)bad.push(`${SP[k].n}: nur ${Math.round(q*100)} % vom Plan (${durT(ist[k])} von ${durT(plan[k])})`)});

  if(easyRuns.length){const m=easyRuns.reduce((x,y)=>x+y,0)/easyRuns.length;if(m>140)bad.push(`Lockere Läufe zu hart: Ø ${Math.round(m)} bpm (Ziel 125–135)`);else good.push(`Lockere Läufe locker gelaufen: Ø ${Math.round(m)} bpm`)}
  const easyRides=[];days.forEach(l=>l.forEach(s=>{const a=MT.byId[s.id];if(a&&a.pw&&s.sport==='bike'&&!s.key)easyRides.push(a.pw)}));
  if(easyRides.length){const m=easyRides.reduce((x,y)=>x+y,0)/easyRides.length;if(m>S.ftp*.78)bad.push(`Z2-Fahrten zu hart: Ø ${Math.round(m)} W (Ziel unter ${r5(S.ftp*.75)} W)`)}
  if(sick)bad.push(`${sick} Kranktag${sick>1?'e':''}: die nächsten Tage locker angehen`);
  const nw=WEEKS[w.i+1];if(nw){next.push(nw.race?`Nächste Woche: ${nw.race.name}. ${raceFocus(nw)}`:nw.dl?'Nächste Woche ist Entlastung: Umfang wirklich reduzieren, Schlaf nachholen.':FOCUS[nw.ph]);
    if(missed.length>1)next.push('Verpasste Schlüsseleinheiten nicht nachholen. Lieber die nächste wie geplant und frisch machen.');
    if(bad.some(b=>/zu hart/.test(b)))next.push('Lockere Einheiten bewusst langsamer: das macht die harten Tage besser.')}
  if(!good.length&&!bad.length)good.push('Noch zu wenig Daten für eine Bewertung. Hake Einheiten ab oder lade Garmin-Daten.');
  return {plan,ist,good,bad,next,hasG,missed,keys:keys.length,sick,off}}

const pad2=n=>String(n).padStart(2,'0');
function wheel(id,kind,val,o){o=o||{};let h=`<input type="hidden" id="${id}" value="${esc(val==null?'':String(val))}"><div class="wheel" data-wheel="${id}" data-kind="${kind}"${o.opt?' data-opt="1"':''}>`;

  if(kind==='ms'||kind==='hm'){let m='',sec='';const mm=String(val||'').match(/^(\d{1,2})[:.,](\d{2})$/);if(mm){m=+mm[1];sec=+mm[2]}
    h+=`<select aria-label="${o.label||id} ${kind==='hm'?'Stunden':'Minuten'}" data-part="a">${opts(o.min,o.max,1,m,v=>String(v),o.opt||m==='')}</select><span class="wsep">${kind==='hm'?'h':':'}</span>
      <select aria-label="${o.label||id} ${kind==='hm'?'Minuten':'Sekunden'}" data-part="b">${opts(0,59,kind==='hm'?5:1,sec===''?0:(kind==='hm'?Math.round(sec/5)*5:sec),pad2,false)}</select><span class="wunit">${o.unit||''}</span>`}
  else{const v=val===''||val==null?'':(kind==='dec'?String(val).replace(',','.'):val);
    h+=`<select aria-label="${o.label||id}" data-part="a">${opts(o.min,o.max,o.step||1,v,kind==='dec'?(x=>String(x).replace('.',',')):(x=>String(x)),o.opt||v==='')}</select><span class="wunit">${o.unit||''}</span>`}

function wheelRead(w){const k=w.dataset.kind,a=w.querySelector('[data-part="a"]'),b=w.querySelector('[data-part="b"]');
  if(a.value==='')return '';if(k==='ms'||k==='hm')return a.value+':'+pad2(b.value);if(k==='dec')return String(a.value).replace('.',',');return a.value}

const NEEDS_KM=['TR','GF','ZF','BZ'];

const runDist=(t,km)=>({K5:5,K10:10,HM:21.0975,M:42.195}[t]||(+km||+S.mainKm||30));
function runEst(t,km,hm){const off={K5:-20,K10:-10,HM:3,M:20,TR:60}[t];let T=runDist(t,km)*(S.thr+(off==null?20:off))/60;if(t==='TR')T+=(+hm||0)/10;return T}
const BM=()=>(S.kg||72)+9;
const pFlat=v=>0.5*1.2*0.32*v*v*v+BM()*9.81*0.004*v;
const bFrac=T=>T<60?0.95:T<120?0.88:T<240?0.8:T<360?0.74:0.68;
function bikeEst(km,hm){km=+km||100;hm=+hm||0;let T=km/28*60;for(let k=0;k<30;k++){const P=S.ftp*bFrac(T),Pc=BM()*9.81*hm/(T*60),Pf=Math.max(30,P-Pc);let lo=1,hi=25;for(let j=0;j<40;j++){const v=(lo+hi)/2;if(pFlat(v)<Pf)lo=v;else hi=v}T=0.5*T+0.5*(km*1000/((lo+hi)/2)/60)}return {T,P:S.ftp*bFrac(T)}}
function bikeReq(km,hm,T){const v=km*1000/(T*60);return pFlat(v)+BM()*9.81*hm/(T*60)}
function placeHard(days,K,hard,avoid){const free=d=>!K.rest.has(d);const nb=d=>[(d+6)%7,(d+1)%7];
  const isHard=(d,sp)=>days[d].some(s=>!s.long&&(s.key||s.inten>=4)&&(!sp||s.sport===sp));const out=[];
  hard.forEach(h=>{const base=[0,1,2,3,4,5,6].filter(d=>free(d)&&!avoid.includes(d));
    let cand=base.filter(d=>!K.short.has(d)&&!isHard(d));if(!cand.length)cand=base.filter(d=>!isHard(d));if(!cand.length)cand=base;if(!cand.length)cand=[0,1,2,3,4,5,6].filter(free);
    const sc=d=>(isHard(d)?20:0)+(K.short.has(d)?8:0)+nb(d).reduce((a,n)=>a+(isHard(n,h.sp)?6:0)+(isHard(n)?3:0)+(avoid.includes(n)?2:0),0);
    const d=cand.sort((a,b)=>sc(a)-sc(b)||a-b)[0];days[d].push(h.s);out.push(d)});return out}
function fillDays(days,K,make,n,cond){const free=d=>!K.rest.has(d);const load=d=>days[d].reduce((a,s)=>a+(s.min||0),0);
  for(let k=0;k<n;k++){const c2=[0,1,2,3,4,5,6].filter(d=>free(d)&&cond(d));if(!c2.length)return;const d=c2.sort((a,b)=>load(a)-load(b)||a-b)[0];const s=make(d,k);if(s)days[d].push(s)}}

    if(o.t==='cancel'){const s=days[o.day]&&days[o.day][o.idx];if(s&&s.sport!=='race')days[o.day][o.idx]=Object.assign({},s,{cancel:o.reason||'abgesagt',opId:o.id});return}

/* Crosstrainer: läuft unter „Laufen“, aber ohne Aufprall */
function xtSess(min,kind,parts,inten,key,why){
  return {sport:'run',xt:true,label:'Crosstrainer',title:'Crosstrainer',kind,min,max:min,steps:parts,inten,key:!!key,inj:true,
    target:[['Dauer',durT(min)],['Gefühl',inten>=4?'hart 8/10, locker 3/10':'locker, Gespräch möglich']],
    focus:`Ersatz für „${why}“ während der Laufpause. Der Crosstrainer trainiert ähnliche Muskeln wie das Laufen, aber ohne Aufprall.`,
    watch:['Aufrecht stehen, nicht auf die Griffe stützen','Ganzer Fuß bleibt auf der Pedale, Ferse nicht abheben','Puls ist etwas niedriger als beim Laufen: nach Gefühl steuern','Tut die Verletzung auch hier weh: abbrechen und aufs Rad oder ins Wasser'],prog:''}}
function xtFor(s){const why=s.kind,runMin=s.min||45;
  const rep=Array.isArray(s.wk)&&s.wk.find(p=>p.rep);
  if((s.key||s.inten>=3)&&!/Long Run/.test(s.kind)){
    let n=6,on=3,off=1.5;if(rep){n=rep.rep.n;on=Math.max(1,Math.round(rep.rep.d*(S.thr+(rep.rep.pa[0]+rep.rep.pa[1])/2)/1000/60));off=Math.max(1,Math.round((rep.rep.pz||60)/60))}
    const main=n*(on+off),min=rmin(Math.max(main+20,runMin));
    return xtSess(min,'Intervalle (statt Lauf)',[['Einlaufen',`${Math.round((min-main)*0.6)}' locker`],['Hauptteil',`${n}× ${on}' hart (Gefühl 8/10, hohe Frequenz, etwas Widerstand), ${off}' locker`],['Auslaufen',`${Math.round((min-main)*0.4)}' locker`]],4,true,why)}
  const min=rmin(Math.min(/Long Run/.test(s.kind)?120:75,runMin));
  return xtSess(min,/Long Run/.test(s.kind)?'Lang (statt Long Run)':'Locker (statt Lauf)',[['Hauptteil',`${min}' gleichmäßig locker, alle 10' 1' etwas zügiger`]],2,false,why)}
/* Schwimmen statt Laufen: ca. gleiche Zeit */
function swimFor(s){const why=s.kind,runMin=s.min||45,hard=(s.key||s.inten>=3)&&!/Long Run/.test(s.kind);
  const min=Math.min(hard?75:90,runMin);const per100=(S.css+(hard?6:12))+12;let rest=Math.max(800,Math.round(min*60/per100)*100-600);
  const B=hard?[{lab:'Ein',n:1,d:400,w:'locker',dp:16},{lab:'Hauptsatz',n:Math.max(6,Math.round(rest*0.7/100)),d:100,w:'auf CSS',dp:0,r:15,showP:1},{lab:'Pull',n:Math.max(2,Math.round(rest*0.3/100)),d:100,drill:'pull',dp:10,r:15},{lab:'Aus',n:1,d:200,w:'locker',dp:20}]
    :[{lab:'Ein',n:1,d:400,w:'locker',dp:16},{lab:'Hauptteil',n:Math.max(2,Math.round(rest/400)),d:400,w:'Kraul aerob, ruhig',dp:12,r:20,showP:1},{lab:'Aus',n:1,d:200,w:'locker',dp:20}];
  return swimSess(hard?'Intensiv (statt Lauf)':/Long Run/.test(s.kind)?'Lang aerob (statt Long Run)':'Locker (statt Lauf)',B,{inten:hard?4:2,key:hard,inj:true,focus:`Ersatz für „${why}“ während der Laufpause.`,watch:['Beim Beinschlag locker bleiben, wenn das verletzte Bein zwickt: mit Pull-Buoy schwimmen'],prog:''})}
const dayBike=(list,ex)=>(list||[]).filter(x=>x!==ex&&x.sport==='bike'&&!x.opt&&!x.cancel).reduce((a,x)=>a+(x.min||0),0);
/* Rad-Ersatz: ca. Laufzeit × 1,25 (Rad belastet pro Minute weniger), am Tag zusammen mit dem schon geplanten Rad höchstens 4 h */
const RUN2BIKE=1.25;
function bikeFor(c,s,dayB){dayB=dayB||0;const why=s.kind;const runMin=s.min||45;const room=240-dayB;
  const o=(inten,key)=>({inten,key,inj:true,focus:`Ersatz für „${why}“ (${durT(runMin)} Laufen) während der Laufpause. Rad ca. 1,25-mal so lang, weil es pro Minute weniger belastet.`,watch:['Tritt nichts weh, ist Radfahren meist gut verträglich. Bei Schmerz: abbrechen'],prog:''});
  if(/Long Run/.test(s.kind)){const m=rmin(Math.min(runMin*RUN2BIKE,room));if(m<45)return null;
    return bikeSess('Grundlage Z2 (statt Long Run)',[{lab:'Einrollen',min:15,spd:SPD.easy,txt:'locker'},{lab:'Hauptteil',min:m-25,spd:SPD.z2,txt:`gleichmäßig Z2 (${W(65,75)})`},{lab:'Ausrollen',min:10,spd:SPD.easy,txt:'locker'}],Object.assign(o(2,false),{target:[['Leistung',W(65,75)]]}))}
  if(s.key||s.inten>=3){const v=s.inten>=5?{s:1,r:5,on:180,off:180,a:106,b:115}:{s:1,r:3,on:600,off:300,a:92,b:98};const im=Math.round(ivMin(v));const tot=rmin(Math.max(im+30,Math.min(runMin*RUN2BIKE,room)));if(tot>room+10)return null;
    return bikeSess(s.inten>=5?'VO2max-Intervalle (statt Lauf)':'Schwelle (statt Lauf)',[{lab:'Einrollen',min:15,spd:SPD.easy,txt:'locker, steigernd'},{lab:'Intervalle',min:im,spd:SPD.int,iv:v,txt:`${ivL(v)} bei ${W(v.a,v.b)}, ${ivP(v)}`},{lab:'Z2',min:tot-25-im,spd:SPD.z2,txt:`Z2 (${W(65,75)})`},{lab:'Ausrollen',min:10,spd:SPD.easy,txt:'locker'}].filter(p=>p.min>0),Object.assign(o(4,true),{target:[['Intervalle',W(v.a,v.b)]]}))}
  const m=rmin(Math.min(runMin*RUN2BIKE,room));if(m<30)return null;return bikeSess('Locker (statt Lauf)',[{lab:'Fahrt',min:m,spd:SPD.easy,txt:`locker, unter ${r5(S.ftp*.65)} W, hohe Frequenz`}],o(1,false))}
function injReplace(c,s,dayB){if(s.sport==='gym')return Object.assign({},s,{watch:['Laufpause: keine Sprünge und keine Übung, die am verletzten Bein schmerzt'].concat(s.watch||[])});
  if(s.sport!=='run')return s;if(/Koppel/.test(s.kind))return Object.assign({},s,{cancel:'Laufpause'});
  const mode=(S.injury&&S.injury.sub)||'auto',hard=(s.key||s.inten>=3)&&!/Long Run/.test(s.kind);
  /* Automatisch: harte Läufe → Crosstrainer-Intervalle; Long Run und lockere Läufe → Rad (lockere nur, wenn an dem Tag noch kein Rad geplant ist), sonst Crosstrainer */
  let r=null;
  if(mode==='swim')r=swimFor(s);
  else if(mode==='xt'||mode==='aqua')r=xtFor(s);
  else if(mode==='bike'||(mode!=='xt'&&!hard&&(/Long Run/.test(s.kind)?dayB<60:dayB===0)))r=bikeFor(c,s,dayB);
  if(!r)r=xtFor(s);return Object.assign(r,{inj:true,orig:s.kind})}
function applyInjury(w,c,days){if(!S.injury||!S.injury.on)return days;return days.map((l,d)=>{if(!injActive(addD(w.start,d)))return l;const out=l.slice();out.forEach((s,k)=>{out[k]=injReplace(c,s,dayBike(out,s))});return out})}
function altOf(c,s,to,dayB){if(to==='easy')return easierOf(c,s);if(to==='bike'){const r=bikeFor(c,s,dayB);return r?Object.assign(r,{orig:s.kind}):Object.assign(xtFor(s),{orig:s.kind})}if(to==='xt'||to==='aqua')return Object.assign(xtFor(s),{orig:s.kind});if(to==='swim')return Object.assign(swimFor(s),{orig:s.kind});return null}

  return `<div class="card" id="injCard"><h2>Verletzung</h2>
   <label class="tgl"><input type="checkbox" id="injOn"${j.on?' checked':''}><span><b>Laufverletzung / Laufpause</b><small>Alle Läufe im Zeitraum werden ersetzt, damit du trotzdem trainieren kannst. Koppelläufe fallen weg, im Gym keine Sprünge.</small></span></label>
   <div id="injOpts"${j.on?'':' hidden'} style="margin-top:12px"><div class="row2"><div class="field"><label for="injFrom">Ab</label><input type="date" id="injFrom" value="${j.from||t}"></div>

   <p class="sumline">Bei Schmerzen, die länger als ein paar Tage anhalten, bitte ärztlich abklären lassen. Wieder einsteigen: zuerst locker, harte Läufe erst nach einer schmerzfreien Woche.</p></div></div>`}
function bindInjury(){const on=$('#injOn');if(!on)return;const upd=()=>{S.injury={on:on.checked,from:$('#injFrom').value||iso(new Date()),until:$('#injUntil').value||'',sub:$('#injSub').value||'auto'};save(NS+'settings',S);$('#injOpts').hidden=!on.checked;renderWeek(0);if(typeof watchSoon==='function')watchSoon()};
  on.onchange=upd;['injFrom','injUntil','injSub'].forEach(id=>{const e=$('#'+id);if(e)e.onchange=upd})}

function wkOf(n){const i=(n==null?cur+1:+n)-1;if(!(i>=0&&i<WEEKS.length))throw new Error('Woche '+n+' gibt es nicht (1–'+WEEKS.length+').');return WEEKS[i]}
function weekInfo(w){const days=sessionsFor(w);return {woche:w.i+1,von:iso(w.start),phase:PH[w.ph].n,entlastung:w.dl,testwoche:!!(w.test||w.unk),rennen:w.race?w.race.name:null,umfang_prozent:FLEX[w.i]||100,
  tage:days.map((l,d)=>({tag:DAYN[d],datum:iso(addD(w.start,d)),einheiten:l.map((s,k)=>({index:k,sport:SP[s.sport].n,art:s.kind,minuten:s.min,schluessel:s.key,notiz:s.note||null}))}))}}

function undoOp(id){const i=OVR.ops.findIndex(o=>o.id===id);if(i<0)return;const o=OVR.ops[i];

const COACH_RULES=()=>`Du bist der virtuelle ${SPORTN[S.sport||'tri']}-Coach in einer Trainingsplan-App. Antworte auf Deutsch in Du-Form, kurz und konkret.
Du kannst den Plan NUR über die bereitgestellten Funktionen ändern (Einheiten verschieben, tauschen, streichen, lockerer machen, Notizen, Wochenumfang, Progression, Kranktage, Leistungswerte). Die Oberfläche und den Aufbau der App kannst und sollst du nicht verändern.

async function askOAI(url,key,model,extra){
  let msgs=[{role:'system',content:COACH_RULES()}].concat(hist().map(m=>({role:m.r==='u'?'user':'assistant',content:m.x})));const tools=TOOLS.map(t=>({type:'function',function:{name:t.name,description:t.description,parameters:t.schema}}));
  for(let round=0;round<6;round++){const r=await fetch(url,{method:'POST',headers:Object.assign({'content-type':'application/json','authorization':'Bearer '+key},extra),body:JSON.stringify({model,messages:msgs,tools})});
    let j={};try{j=await r.json()}catch(e){}if(r.status===402)throw new Error('Dein Guthaben ist aufgebraucht. Bei OpenRouter unter openrouter.ai/settings/credits aufladen.');if(!r.ok)throw new Error((j.error&&j.error.message)||('Fehler '+r.status));const m=j.choices[0].message;
    if(!m.tool_calls||!m.tool_calls.length)return m.content||'';msgs.push(m);
    for(const tc of m.tool_calls){let a={};try{a=JSON.parse(tc.function.arguments||'{}')}catch(e){}msgs.push({role:'tool',tool_call_id:tc.id,content:JSON.stringify(await runTool(tc.function.name,a))})}}
  return 'Ich habe die Änderungen vorgenommen.'}
async function askGemini(){const key=AI.keys.gemini;if(!key)throw new Error('Bitte zuerst einen Gemini-API-Schlüssel eintragen.');
  let contents=hist().map(m=>({role:m.r==='u'?'user':'model',parts:[{text:m.x}]}));const tools=[{functionDeclarations:TOOLS.map(t=>({name:t.name,description:t.description,parameters:Object.keys(t.schema.properties||{}).length?t.schema:undefined}))}];
  for(let round=0;round<6;round++){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(AI.models.gemini)}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:COACH_RULES()}]},contents,tools})});
    const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||('Fehler '+r.status));const parts=(j.candidates&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
    const calls=parts.filter(p=>p.functionCall);if(!calls.length)return parts.map(p=>p.text||'').join('');
    contents.push({role:'model',parts});const resp=[];for(const c of calls)resp.push({functionResponse:{name:c.functionCall.name,response:{result:await runTool(c.functionCall.name,c.functionCall.args)}}});contents.push({role:'user',parts:resp})}
  return 'Ich habe die Änderungen vorgenommen.'}

   <div id="lup" hidden><label class="unk"><input type="checkbox" id="lc1"><span>Ich akzeptiere die <a href="nutzungsbedingungen.html" target="_blank">Nutzungsbedingungen</a> und habe die <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a> gelesen.</span></label>
   <label class="unk"><input type="checkbox" id="lc2"><span>Ich willige ausdrücklich ein, dass meine Trainings- und Gesundheitsdaten (z. B. Puls, Kranktage, Leistungswerte) zur Erstellung meines Plans gespeichert und verarbeitet werden. Widerruf jederzeit durch Löschen des Kontos.</span></label>
   <label class="unk"><input type="checkbox" id="lc3"><span>Ich bin mindestens 16 Jahre alt.</span></label></div>
   <div class="toast" id="ltoast" role="status">${msg?esc(msg):''}</div><button class="btn" type="submit" id="lgo">Anmelden</button>
   <button class="linkbtn" type="button" id="lforgot">Passwort vergessen?</button></form>
   <button class="btn ghost" type="button" id="loff">Ohne Konto ausprobieren (nur dieses Gerät)</button>
   <p class="sumline"><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a> · <a href="nutzungsbedingungen.html">Nutzungsbedingungen</a></p></div>`;
  document.body.append(h);document.body.style.overflow='hidden';const T=$('#ltoast');const err=(m,c)=>{T.style.color=c||'var(--run)';T.textContent=m};
  const mode=()=>h.querySelector('input[name="lmode"]:checked').value;
  h.querySelectorAll('input[name="lmode"]').forEach(r=>r.onchange=()=>{const up=mode()==='up';$('#lup').hidden=!up;$('#lgo').textContent=up?'Konto erstellen':'Anmelden';$('#lpw').autocomplete=up?'new-password':'current-password';$('#lpwh').textContent=up?'Mindestens 8 Zeichen.':''});
  $('#loff').onclick=()=>{h.remove();document.body.style.overflow='';startOffline()};
  if(!SB){$('#lf').hidden=true;h.querySelector('[role=tablist]').hidden=true;$('#lf').insertAdjacentHTML('afterend','<p class="connlead">Anmeldung ist hier nicht verfügbar (Seite lokal geöffnet oder noch nicht eingerichtet). Du kannst den Plan trotzdem ohne Konto nutzen.</p>')}
  $('#lforgot').onclick=async()=>{const m=$('#lmail').value.trim();if(!m)return err('Bitte zuerst deine E-Mail eintragen.');const {error}=await SB.auth.resetPasswordForEmail(m,{redirectTo:location.origin+'/'});err(error?error.message:'Wir haben dir eine E-Mail zum Zurücksetzen geschickt.',error?null:'var(--ok)')};
  $('#lf').onsubmit=async e=>{e.preventDefault();const m=$('#lmail').value.trim(),pw=$('#lpw').value;if(!m||pw.length<8)return err('Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.');
    if(mode()==='up'){if(!$('#lc1').checked||!$('#lc2').checked||!$('#lc3').checked)return err('Bitte alle drei Punkte bestätigen.');
      const {data,error}=await SB.auth.signUp({email:m,password:pw,options:{emailRedirectTo:location.origin+'/',data:{consent_health:new Date().toISOString(),consent_terms:new Date().toISOString()}}});
      if(error)return err(error.message);if(!data.session)return err('Fast geschafft: Bitte bestätige deine E-Mail-Adresse über den Link, den wir dir geschickt haben.','var(--ok)')}
    else{const {error}=await SB.auth.signInWithPassword({email:m,password:pw});if(error)return err(error.message==='Invalid login credentials'?'E-Mail oder Passwort falsch.':error.message)}}}
function showNewPassword(){const h=document.createElement('div');h.id='login';h.className='wiz';h.innerHTML=`<div class="wiz-in"><h1>Neues Passwort</h1><form class="form" id="npf"><div class="field"><label for="np">Neues Passwort</label><input id="np" type="password" autocomplete="new-password" minlength="8"></div><div class="toast" id="nptoast"></div><button class="btn" type="submit">Speichern</button></form></div>`;
  document.body.append(h);$('#npf').onsubmit=async e=>{e.preventDefault();const {error}=await SB.auth.updateUser({password:$('#np').value});if(error){$('#nptoast').textContent=error.message;return}h.remove();alertBox('Passwort geändert.')}}
/* Start */
let BOOTED=false;
function bootApp(){syncGM();syncHead();buildWeeks();cur=Math.max(0,Math.min(WEEKS.length-1,weekIdx(new Date())));renderWeek(0);if(!BOOTED){mountCoach();BOOTED=true}setSyncState('gespeichert');if(!S.setup)openWizard()}
function startOffline(){OFFLINE=true;NS='trv.local.';reloadState();bootApp();orReturn()}
let STARTED=false;
async function startUser(session){if(STARTED)return;STARTED=true;SESSION=session;NS='trv.'+session.user.id.slice(0,8)+'.';reloadState();const l=document.getElementById('login');if(l){l.remove();document.body.style.overflow=''}
  await cloudPull();bootApp();try{WELL=JSON.parse(localStorage.getItem(NS+'well')||'[]')||[]}catch(e){WELL=[]}
  await orReturn();await icuStatus();await icuSync(false);await wellSync(false);if(ICU.connected){renderWeek(0);watchSoon()}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){icuSync(false);wellSync(false)}})}
(async function main(){
  try{const r=await _fetch(API+'config');if(r.ok)CFG=await r.json()}catch(e){}
  if(CFG&&CFG.supabaseUrl&&window.supabase){SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}})}
  if(!SB){try{if(localStorage.getItem('trv.local.settings')){startOffline();return}}catch(e){}showLogin();return}
  // Fehler aus dem Bestätigungslink anzeigen (z. B. Link abgelaufen)
  const hp=new URLSearchParams(location.hash.slice(1)+'&'+location.search.slice(1));const linkErr=hp.get('error_description');
  if(linkErr)history.replaceState(null,'',location.pathname);
  // Wichtig: im Callback keine weiteren Supabase-Aufrufe direkt ausführen (sonst blockiert die Anmeldung), deshalb setTimeout
  SB.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{if(ev==='PASSWORD_RECOVERY')showNewPassword();else if(session&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'))startUser(session);if(ev==='SIGNED_OUT'){SESSION=null}},0)});
  let data=null;try{({data}=await SB.auth.getSession())}catch(e){}
  if(data&&data.session)startUser(data.session);else if(!STARTED)showLogin(linkErr?('Der Bestätigungslink hat nicht funktioniert: '+linkErr+'. Bitte melde dich an oder registriere dich erneut.'):'');
})();

</script>
